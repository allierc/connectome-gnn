description: "Larval-zebrafish dIPN HD circuit + IPN12_a/b \u2014 ALTERNATIVE EXCITATORY-IPN12\
  \ variant of zebrafish_hd_si_ipn12_v1.\nIdentical training recipe and identical\
  \ 839-cell neuron pool as zebrafish_hd_si_ipn12_v1; the only difference is the Dale-flip\
  \ convention. In v1 the IPN12_a and IPN12_b cells inherit the IPNd / IPNds inhibitory\
  \ prior; in v2 their outgoing weights are LEFT POSITIVE (excitatory) \u2014 corresponding\
  \ to the alternative biological hypothesis that IPN12 cells are glutamatergic rather\
  \ than GABAergic.\nThis is the ablation that tests whether the L\u2194R alternation\
  \ observed in IPN12 activity (see docs/zebrafish.tex \xA7Functional comparison)\
  \ is Dale-sign dependent or purely structural. If v2 still shows the alternation,\
  \ the asymmetry is in the connectome topology alone; if v2 loses it, the inhibitory\
  \ sign is load-bearing.\nDataset zarrs are SHARED with zebrafish_hd_si_ipn12_v1:\
  \ same swim_integration stimulus, same task seed, so the two trained checkpoints\
  \ are head-to-head comparable on identical test trials. Different log_dir (zebrafish_hd_si_ipn12_v2)\
  \ so the v1 checkpoint stays intact.\nSee docs/zebrafish.tex \xA7Circuit variants\
  \ and the IPN12 extension."
dataset: zebrafish_hd_si_task_ipn12_v1
