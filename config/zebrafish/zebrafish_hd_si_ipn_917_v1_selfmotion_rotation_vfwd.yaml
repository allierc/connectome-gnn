description: Latent path-integration probe — HEADING-ONLY supervision but v_fwd is
  KEPT in the input. On the NEW nominal 917-cell circuit
  (zebrafish_HD_IPN_917_artr_pt1 — ω → ARTR, v_fwd → pt-IPN1). The network sees the
  full 4-ch input [omega, v_fwd, cos0, sin0] (n_in=4, v_fwd routed to pt-IPN1 by
  velocity_gate=pen_artr_ptipn1, exactly as in the heading+distance / 2-D path
  runs) but is trained to report ONLY heading [cos, sin] (n_out=2). It is never
  asked for distance, x, or y. Question --- does the connectome-locked recurrent
  circuit spontaneously build a translation / position representation it is never
  supervised on? After training, decode v_fwd, integrated distance, and (x, y)
  from the hidden state and project onto the translation axes. Compare against the
  heading+distance ([rotation,translation]) and 2-D path ([position_2d]) runs that
  share this dataset to test whether the translation manifold is inherited from the
  input, induced by the task, or spontaneously generated by the dynamics.
  training.task_targets=['rotation_vfwd'] → slices input to [omega, v_fwd, cos0,
  sin0] (n_in=4) and target to [cos, sin] (n_out=2). Trained on the position_2d
  dataset zebrafish_hd_si_task_917_position_2d so the held-out test set carries the
  true (x, y) for post-hoc decoding (only [0,1] is supervised; [x,y] is unused GT).
dataset: zebrafish_hd_si_task_917_position_2d
simulation:
  params:
  - - 1.0
  connconstr_datapath: figures/zebrafish/zebrafish_connectome_HD_IPN_917
  seed: 47006
