  aggr_type: add
  input_proj: matrix
  output_proj: matrix
  velocity_gate: pen_artr_ptipn1
  lock_edge_signs: true
  hidden_dim: 128
  n_layers: 3
  MLP_activation: relu
  output_from_dipn_only: true
  n_input: 4
  n_output: 2
