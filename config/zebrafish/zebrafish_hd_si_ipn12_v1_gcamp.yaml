description: "Larval-zebrafish dIPN HD RNN (839-cell IPN12 v1) trained with REAL\
  \ calcium observation supervision.\nIdentical to zebrafish_hd_si_ipn12_v1_cv0 (same\
  \ connectome, same synthetic swim-integration task = dataset A) but with an extra\
  \ calcium observation branch: each task batch is augmented by training.calcium_batch_size\
  \ real-calcium trials from dataset B (zebrafish_hd_si_calcium_rotation_ipn12_v1,\
  \ 10s windows of the ZAPBench Rotations block with per-neuron ΔF/F interpolated\
  \ to the model grid). The heading MSE (first term) runs over the combined batch;\
  \ the extra trials' rolled-out voltage is converted to calcium through the GCaMP\
  \ class (simulation.gcamp_kernel) and matched to the recorded ΔF/F with a\
  \ scale-invariant (per-trial-per-neuron z-scored) loss weighted by coeff_observation.\
  \ calcium_batch_size: 0 recovers task-only training byte-for-byte."
dataset: zebrafish_hd_si_task_ipn12_v1
simulation:
  params:
  - - 1.0
  connconstr_datapath: figures/zebrafish/zebrafish_connectome_HD_IPN12
  seed: 47006
  gcamp_kernel: gcamp7f
graph_model:
  signal_model_name: zebrafish_hd_si
  aggr_type: add
  input_proj: matrix
  output_proj: matrix
  velocity_gate: pen_4scalar
  lock_edge_signs: true
  hidden_dim: 128
  n_layers: 3
  MLP_activation: relu
  output_from_dipn_only: true
circuit:
  name: zebrafish_HD_IPN12_839_v1
plotting:
  anatomy_voltage_elev: 90.0
  anatomy_voltage_azim: -85.5
  anatomy_voltage_z_lo: 0.0
  anatomy_voltage_z_hi: 10.0
  anatomy_voltage_alpha: 1.0
  anatomy_voltage_downsample: 10
  anatomy_voltage_bg: black
  anatomy_voltage_show_base: true
  anatomy_voltage_show_icon: true
  anatomy_voltage_types:
  - IPN12_a
  - IPN12_b
  anatomy_voltage_pattern: swim_left
  anatomy_voltage_n_steps: 2000
  anatomy_voltage_stride: 5
  anatomy_voltage_frame_idx: -1
  anatomy_voltage_omega_deg: 60.0
  anatomy_voltage_theta0_rad: 0.0
  anatomy_voltage_swim_interval_s: 0.3
  anatomy_voltage_swim_magnitude_rad: 0.393
  anatomy_voltage_swim_t_event_s: 0.0
  anatomy_voltage_seed: 0
training:
  device: auto
  seed: 547506
  n_runs: 1
  n_epochs: 10
  batch_size: 64
  data_augmentation_loop: 10
  lr: 0.002
  lr_W_rec_schedule:
  - 0.0005
  - 0.0005
  - 0.00025
  - 0.000125
  - 0.000125
  - 0.0001
  - 0.0001
  - 0.0001
  - 5.0e-05
  - 5.0e-05
  - 5.0e-05
  - 5.0e-05
  - 5.0e-05
  - 5.0e-05
  - 5.0e-05
  - 5.0e-05
  - 5.0e-05
  - 5.0e-05
  - 5.0e-05
  - 5.0e-05
  lr_scheduler: none
  lr_W_ED: 0.0025
  grad_clip_W: 2.5
  coeff_cos_distance: 0.0
  coeff_norm_floor: 0.0
  kappa_norm_floor: 0.0
  coeff_tv_circular: 0.0
  coeff_W_L1: 0.0
  noise_recurrent_level: 0.03
  snapshots_per_epoch: 5
  n_steps_schedule:
  - 100
  - 100
  - 200
  - 200
  - 300
  - 400
  - 500
  - 600
  - 700
  - 800
  - 800
  - 800
  - 800
  - 800
  - 800
  - 800
  - 800
  - 800
  - 800
  - 800
  coeff_tail_loss: 0.035
  calcium_batch_size: 8
  calcium_dataset: zebrafish_hd_si_calcium_rotation_ipn12_v1
  coeff_observation: 1.0
  torch_compile: false
  w_init_mode: w_con
claude:
  n_epochs: 5
  data_augmentation_loop: 1
  n_iter_block: 40
  n_parallel: 10
  node_name: a100
  generate_data: false
  training_time_target_min: 30
task:
  task_type: swim_integration
  task_only: true
  swim_integration:
    n_trials_train: 100000
    n_trials_test: 10000
    n_steps: 1000
    dt: 0.01
    swim_rate_hz: 0.5
    swim_duration_s: 0.3
    phase_impulse_mean_rad: 0.785
    phase_impulse_std_rad: 0.4
    backward_phase_mean_rad: 3.14
    backward_phase_std_rad: 0.3
    left_fraction: 0.4
    right_fraction: 0.4
    forward_fraction: 0.15
    backward_fraction: 0.05
    omega_noise_level: 0.0
    seed: 0
