description: 'Conductance STUDENT distilled from the current-based flyvis teacher, noise-free, fold 0. msg_ij = W_ij^2 * relu(v_j) * (E_ij - v_i), dv/dt = (-v + sum msg + I + V_rest)/tau, with E_ij = E_inh where the connectome sign is negative and E_exc where positive, assigned PER EDGE because Dale s law fails here (4,573 of 13,279 presynaptic neurons have mixed-sign outgoing edges). W enters squared so the conductance is non-negative and the message sign comes from the driving force alone. This is NOT parameter recovery -- the teacher has no (E - v_i) term, so there is no conductance ground truth and a discrepancy in the learned constants is expected. The test is the ROLLOUT: this model is only useful if it can run free and stay on the teacher s trajectory, because it then becomes the ground truth for the noise_free/005/05 datasets. RIG: tau and V_rest learned PER NEURON, 13,741 x 2 = 27,482 parameters. 211x more than the teacher needs, so it is the overparameterised control -- if it beats per_type the gain is capacity absorbing model mismatch, not structure.'
