description: ' The g_phi shape priors are OFF here, and that is the point. coeff_g_phi_diff penalises relu(g_phi(v_j) - g_phi(v_j+d)), i.e. it charges the model whenever g_phi DECREASES in the presynaptic voltage. With w_squared true the conductance W**2 is non-negative and the sign of the synapse lives entirely in g_phi, so every inhibitory edge must have g_phi decreasing in v_j -- measured on this dataset, the true message decreases in v_j on 99.0%% of (edge, frame) samples for the 151,155 inhibitory edges and on 0.0%% for the 282,957 excitatory ones, so at coeff 375 the prior was fining 34.5%% of all samples for being correct. coeff_g_phi_norm is off for the same reason: it drives EVERY sampled edge''s g_phi toward the same positive value 2*xnorm at the probe point, which an inhibitory edge cannot satisfy while carrying its own sign. Removing both leaves the W <-> g_phi gauge unpinned, so read the scale-free numbers -- msg_i R2 after dividing out the scale, and w_r2_scaled -- rather than the raw ones. On top of that, coeff_f_theta_msg_diff 375: a one-sided hinge, relu(f_theta(msg) - f_theta(msg+d)), forcing df/dmsg >= 0. The true ODE has dv/dt = (-v + msg + I + V_rest)/tau, so df/dmsg = +1/tau > 0 everywhere; the previous run at sigma 0.05 learned df/dmsg NEGATIVE across the whole (v, msg) grid, -15.2 on average and ranging -34.0 to -4.8, with a learned message scale of -0.145 -- the model''s message was the negative of the generator''s and f_theta un-flipped it. Nothing forbade that, because a global -1 can move freely between g_phi and f_theta. The hinge is exactly zero once satisfied, so it costs no gradient at convergence and any change is attributable to escaping the flip rather than to added regularisation pressure. The value 375 mirrors the g_phi hinge it replaces and is NOT tuned. coeff_g_phi_weight_L1 0.14 -> 0. With coeff_g_phi_norm gone there was nothing holding g_phi''s scale away from zero, and the elementwise L1 found its cheapest solution: on all four sigma-0 arms the learned message scale fell to ~1e-13 by iteration 16,001 and stayed there, msg_i R2 pinned at -0.0021 (the R2 of predicting zero) while f_theta alone carried a rollout of 0.89 on leak plus stimulus. The prior run with the priors on had scale 0.58 at the same iteration. This is the collapse the exploration agent flagged 0.14 for in its first batch; coeff_g_phi_norm had been masking it. No shrinkage on g_phi now: the W <-> g_phi gauge is unpinned, so read the scale-free numbers. PARAMETERISATION CORRECTED 2026-09-10: this spec was created at 19fc0eb8 with g_phi_positive true and no w_squared -- sign in W, g_phi squared, the CURRENT-model form -- while its sigma-0.05 twin was created with the conductance form. Every sigma-0 GNN result before this correction, including the rollout 0.996 / msg_i R2 0.58 that was set against sigma 0.05, was of a model that cannot represent a reversing driving force at all: a fixed per-edge sign in W cannot follow (E_ij - v_i) across zero, which it does on 18%% of samples here. Now g_phi_positive false and w_squared true, identical to the sigma-0.05 spec except for the dataset, so the noise comparison is of one model. The earlier sentences in this description that assert w_squared true were written before this was noticed and describe the intent, not what ran.'
