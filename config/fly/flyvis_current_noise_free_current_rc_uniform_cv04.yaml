description: 'ROLLOUT uniform, K=1..5 curriculum, paired against flyvis_current_noise_free_current_cv04 on flyvis_A noise-free, fold 4. 5 epochs x 100 augmentation loops against the baseline s 1 x 500, so the two run the same 500 iterations; the curriculum needs one epoch per horizon because rollout_horizon_schedule is indexed by epoch. frame_target_offset 1 holds the start-frame range at the baseline s 63995, so the sampled-k distribution is identical and epoch 0 draws the baseline s first 400 frames. Epochs 1-4 draw from RandomState(seed+epoch), which the 1-epoch baseline has no counterpart for -- the arms are iteration-matched, not stream-identical.'
dataset: flyvis_noise_free_blank50_cv04
simulation:
  connectivity_file: to be specified
  adjacency_matrix: ''
  params:
  - - 1.0
    - 1.0
    - 1.0
    - 1.0
  n_neurons: 13741
  n_input_neurons: 1736
  n_neuron_types: 65
  n_edges: 434112
  n_frames: 64000
  delta_t: 0.02
  baseline_value: 0
  visual_input_type: DAVIS
  noise_model_level: 0.0
  seed: 46
  datavis_roots:
  - /groups/saalfeld/home/kumarv4/web_datasets/DAVIS2017-partial-test
  skip_short_videos: true
  blank_prefix_fraction: 0.5
graph_model:
  signal_model_name: flyvis_current
  prediction: first_derivative
  input_size: 3
  n_layers: 3
  hidden_dim: 80
  output_size: 1
  input_size_update: 5
  n_layers_update: 3
  hidden_dim_update: 80
  output_size_update: 1
  aggr_type: add
  embedding_dim: 2
  update_type: generic
  g_phi_positive: true
plotting:
  colormap: tab20
  arrow_length: 1
  xlim:
  - -2.5
  - 2.5
  ylim:
  - -100
  - 100
training:
  torch_compile: true
  mlp_precision: bf16
  n_runs: 1
  device: auto
  recurrent_training: true
  time_step: 1
  batch_size: 4
  regul_batch_scaling: sqrt
  batch_ratio: 1
  small_init_batch_size: false
  sparsity: none
  lr_W: 0.0009
  lr: 0.0018
  lr_embedding: 0.002325
  coeff_g_phi_diff: 375
  coeff_g_phi_norm: 0.45
  coeff_g_phi_weight_L1: 0.14
  coeff_g_phi_weight_L2: 0
  coeff_f_theta_msg_diff: 0
  coeff_f_theta_weight_L1: 0.025
  coeff_f_theta_weight_L2: 0.0005
  coeff_W_L1: 7.5e-05
  coeff_W_L2: 7.5e-07
  regul_annealing_rate: 0.0
  w_init_mode: randn_scaled
  use_gt_edges: true
  seed: 1046
  n_epochs: 5
  data_augmentation_loop: 100
  rollout_horizon_schedule: [1, 2, 3, 4, 5]
  rollout_step_weighting: uniform
  rollout_step_reduction: mean
  frame_target_offset: 1
config_file: fly/flyvis_current_noise_free_current_rc_uniform_cv04
