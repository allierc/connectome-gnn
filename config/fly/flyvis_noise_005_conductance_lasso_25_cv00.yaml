description: "Task 4b: width-6 twin of the Task 4 group-lasso sweep, coeff_g_phi_input_group_L1 = 50.0, cv00 seed 1041, 1.6M iterations. Identical to flyvis_noise_005_noiseprobe_lasso50_cv00 except the 2 pure-noise columns are removed (input_size 8->6). Isolates whether the noise columns themselves perturb the lasso dose-response: Task 4 measures the response WITH the calibration instrument attached, this measures it without. Note this is NOT comparable to the older 6.32M grouplasso sweep, which used 8 epochs x dal 500 rather than 5 x 100."
dataset: flyvis_noise_005_blank50_cv00
simulation:
  connectivity_file: to be specified
  adjacency_matrix: ""
  params:
    - - 1.0
      - 1.0
      - 1.0
      - 1.0
  n_neurons: 13741
  n_input_neurons: 1736
  n_neuron_types: 65
  n_edges: 434112
  n_frames: 64000
  delta_t: 0.02
  baseline_value: 0
  visual_input_type: DAVIS
  noise_model_level: 0.05
  seed: 42
  datavis_roots:
    - /groups/saalfeld/home/kumarv4/web_datasets/DAVIS2017-partial-test
  skip_short_videos: true
  blank_prefix_fraction: 0.5
graph_model:
  signal_model_name: flyvis_conductance
  prediction: first_derivative
  input_size: 6
  n_layers: 3
  hidden_dim: 80
  output_size: 1
  input_size_update: 5
  n_layers_update: 3
  hidden_dim_update: 80
  output_size_update: 1
  aggr_type: add
  embedding_dim: 2
  update_type: generic
  g_phi_positive: true
plotting:
  colormap: tab20
  arrow_length: 1
  xlim:
    - -2.5
    - 2.5
  ylim:
    - -100
    - 100
training:
  torch_compile: true
  mlp_precision: fp32
  n_runs: 1
  device: auto
  recurrent_training: false
  time_step: 1
  batch_size: 4
  regul_batch_scaling: sqrt
  batch_ratio: 1
  small_init_batch_size: false
  sparsity: none
  lr_W: 0.0009
  lr: 0.0018
  lr_embedding: 0.002325
  coeff_g_phi_diff: 375
  coeff_g_phi_norm: 0.45
  coeff_g_phi_weight_L1: 0
  coeff_g_phi_weight_L2: 0
  coeff_g_phi_input_group_L1: 25
  coeff_f_theta_msg_diff: 0
  coeff_f_theta_weight_L1: 0.025
  coeff_f_theta_weight_L2: 0.0005
  coeff_W_L1: 7.5e-05
  coeff_W_L2: 7.5e-07
  regul_annealing_rate: 0.0
  w_init_mode: randn_scaled
  use_gt_edges: true
  seed: 1041
  deterministic: false
  n_epochs: 5
  data_augmentation_loop: 100
