description: ' The g_phi shape priors are OFF here, and that is the point. coeff_g_phi_diff penalises relu(g_phi(v_j) - g_phi(v_j+d)), i.e. it charges the model whenever g_phi DECREASES in the presynaptic voltage. With w_squared true the conductance W**2 is non-negative and the sign of the synapse lives entirely in g_phi, so every inhibitory edge must have g_phi decreasing in v_j -- measured on this dataset, the true message decreases in v_j on 99.0%% of (edge, frame) samples for the 151,155 inhibitory edges and on 0.0%% for the 282,957 excitatory ones, so at coeff 375 the prior was fining 34.5%% of all samples for being correct. coeff_g_phi_norm is off for the same reason: it drives EVERY sampled edge''s g_phi toward the same positive value 2*xnorm at the probe point, which an inhibitory edge cannot satisfy while carrying its own sign. Removing both leaves the W <-> g_phi gauge unpinned, so read the scale-free numbers -- msg_i R2 after dividing out the scale, and w_r2_scaled -- rather than the raw ones. ARM gnn_gzero, on top of the priors-off base: coeff_g_phi_zero_below 5. Pins g_phi to ZERO on data samples where the presynaptic voltage is below 0 -- the one point every edge''s message is exactly zero, since relu(v_j) = 0 there whatever E_ij and v_i are. This is the physically correct anchor for the msg_i <-> V_rest gauge: dv/dt = (-v + msg + I + V_rest)/tau cannot tell msg + c from V_rest - c, and f_theta absorbs a constant PER CELL TYPE because it takes the embedding, which is the family of parallel streaks in the msg_i scatter (R2 0.586, slope 0.71) and the 38.65%% outlier rate on V_rest of the same run. The value 5 is UNTUNED, sized between the 0.45 of the positive point-anchor it replaces and the 375 of the hinges. coeff_g_phi_weight_L1 0.14 -> 0. With coeff_g_phi_norm gone there was nothing holding g_phi''s scale away from zero, and the elementwise L1 found its cheapest solution: on all four sigma-0 arms the learned message scale fell to ~1e-13 by iteration 16,001 and stayed there, msg_i R2 pinned at -0.0021 (the R2 of predicting zero) while f_theta alone carried a rollout of 0.89 on leak plus stimulus. The prior run with the priors on had scale 0.58 at the same iteration. This is the collapse the exploration agent flagged 0.14 for in its first batch; coeff_g_phi_norm had been masking it. No shrinkage on g_phi now: the W <-> g_phi gauge is unpinned, so read the scale-free numbers.'
