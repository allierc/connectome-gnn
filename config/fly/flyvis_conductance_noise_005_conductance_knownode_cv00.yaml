description: 'TRAINING spec. flyvis_conductance_known_ode fitted to flyvis_conductance_noise_005_blank50_cv00, the dataset generated BY a conductance model at noise_model_level 0.05. RECOVERY, NOT DISTILLATION, and that is why this spec carries no student_* knob. The generator has the same msg = W*relu(v_j)*(E_ij - v_i) form the model assumes, so W_ij, E_ij, tau and V_rest all have true values on disk in ode_params.pt; the trainer resolves the conductance params class from the ground_truth_model key in that file. With train_on_teacher left False, FlyvisConductanceKnownODE._resolve_student_knobs supplies RECOVERY_DEFAULTS -- reversals learned and PER NEURON, tau/V_rest per neuron, no margin pinning, student_init default -- and REFUSES any student_* key a spec tries to set, since those knobs only choose a parameterisation for reversals a current-based teacher cannot identify. Per-neuron is deliberately looser than the truth: the generating student was margin/global, so the true E is the two numbers E_exc +24.7749 and E_inh -14.4716, and fitting 27,482 reversals then watching them collapse onto two is a result the tmp_training/Eij scatter shows directly, where telling the model ''global'' would hand it the answer. Per-edge polarity comes from ode_params.edge_is_inh rather than sign(W), which is uniformly non-negative on this data. rollout_frames 1000 keeps the free-run diagnostic, which no longer requires claiming to be a distillation; unlike the distillation runs it is not the only acceptance test, since R2 on W_ij and RMSE on E_ij are both meaningful now.'
dataset: flyvis_conductance_noise_005_blank50_cv00
simulation:
  connectivity_file: to be specified
  adjacency_matrix: ''
  params:
  - - 1.0
    - 1.0
    - 1.0
    - 1.0
  n_neurons: 13741
  n_input_neurons: 1736
  n_neuron_types: 65
  n_edges: 434112
  n_frames: 64000
  delta_t: 0.02
  baseline_value: 0
  visual_input_type: DAVIS
  noise_model_level: 0.05
  seed: 42
  datavis_roots:
  - /groups/saalfeld/home/kumarv4/web_datasets/DAVIS2017-partial-test
  skip_short_videos: true
  blank_prefix_fraction: 0.5
graph_model:
  signal_model_name: flyvis_conductance_known_ode
  prediction: first_derivative
  input_size: 3
  n_layers: 3
  hidden_dim: 80
  output_size: 1
  input_size_update: 5
  n_layers_update: 3
  hidden_dim_update: 80
  output_size_update: 1
  aggr_type: add
  embedding_dim: 2
  update_type: generic
  g_phi_positive: true
plotting:
  colormap: tab20
  arrow_length: 1
  xlim:
  - -2.5
  - 2.5
  ylim:
  - -100
  - 100
training:
  torch_compile: true
  mlp_precision: bf16
  n_runs: 1
  device: auto
  recurrent_training: false
  time_step: 1
  batch_size: 4
  regul_batch_scaling: sqrt
  batch_ratio: 1
  small_init_batch_size: false
  sparsity: none
  lr_W: 0.0009
  lr: 0.0018
  lr_embedding: 0.002325
  coeff_g_phi_diff: 375
  coeff_g_phi_norm: 0.45
  coeff_g_phi_weight_L1: 0.14
  coeff_g_phi_weight_L2: 0
  coeff_f_theta_msg_diff: 0
  coeff_f_theta_weight_L1: 0.025
  coeff_f_theta_weight_L2: 0.0005
  coeff_W_L1: 7.5e-05
  coeff_W_L2: 7.5e-07
  regul_annealing_rate: 0.0
  w_init_mode: randn_scaled
  use_gt_edges: true
  seed: 1042
  n_epochs: 1
  data_augmentation_loop: 100
  rollout_frames: 1000
config_file: fly/flyvis_conductance_noise_005_conductance_knownode_cv00
