description: 'TRAINING spec. flyvis_conductance_known_ode fitted to flyvis_conductance_noise_005_blank50_cv00, the dataset generated BY a conductance model at noise_model_level 0.05. This is the first conductance run that is genuine parameter recovery rather than distillation: the generator carries the same msg = W*relu(v_j)*(E_ij - v_i) form the student assumes, so W_ij, E_ij, tau and V_rest all have true values on disk in ode_params.pt; the trainer resolves the conductance class from the ground_truth_model key in that file, so this training spec carries no simulation.ground_truth_model of its own (that knob is generation-only and demands a conductance_checkpoint). conductance_reversal_mode learned with conductance_reversal_dim global, matching the ground truth exactly -- the generating student was margin/global, so the true E is two numbers, E_exc +24.7749 and E_inh -14.4716, and the fitted E is two free parameters aimed at them. conductance_init default, NOT teacher_closed_form: that init divides the teacher weight by (E - Vbar) to convert a signed current weight into a conductance, and on this dataset W is ALREADY a non-negative conductance, so the quotient is negative on every inhibitory edge and the guard refuses it. Per-edge polarity comes from ode_params.edge_is_inh rather than sign(W), which is uniformly non-negative here. Rollout kept on as a per-checkpoint diagnostic; unlike the distillation runs it is not the only acceptance test, since R2 on W_ij and RMSE on E_ij are both meaningful now.'
