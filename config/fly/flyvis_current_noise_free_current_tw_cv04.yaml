description: 'Per-neuron target weighting (the reference schedule s_j) on flyvis_A noise-free, fold 4. Identical to flyvis_current_noise_free_current_cv04 except target_weighting: the fit residual is scaled by 1/std_t(dv_j/dt), floored at p5 and renormalised to RMS 1. Still ONE-STEP -- this isolates the loss weighting from the rollout question. Unweighted, the fastest 10%% of neurons carry 45%% of the squared loss and the per-neuron std spans 4250x; the floor holds the weight spread at 61x and RMS 1 keeps the fit magnitude within 1.1%% so coeff_* stay calibrated.'
dataset: flyvis_noise_free_blank50_cv04
simulation:
  connectivity_file: to be specified
  adjacency_matrix: ''
  params:
  - - 1.0
    - 1.0
    - 1.0
    - 1.0
  n_neurons: 13741
  n_input_neurons: 1736
  n_neuron_types: 65
  n_edges: 434112
  n_frames: 64000
  delta_t: 0.02
  baseline_value: 0
  visual_input_type: DAVIS
  noise_model_level: 0.0
  seed: 46
  datavis_roots:
  - /groups/saalfeld/home/kumarv4/web_datasets/DAVIS2017-partial-test
  skip_short_videos: true
  blank_prefix_fraction: 0.5
graph_model:
  signal_model_name: flyvis_A
  prediction: first_derivative
  input_size: 3
  n_layers: 3
  hidden_dim: 80
  output_size: 1
  input_size_update: 5
  n_layers_update: 3
  hidden_dim_update: 80
  output_size_update: 1
  aggr_type: add
  embedding_dim: 2
  update_type: generic
  g_phi_positive: true
plotting:
  colormap: tab20
  arrow_length: 1
  xlim:
  - -2.5
  - 2.5
  ylim:
  - -100
  - 100
training:
  torch_compile: true
  mlp_precision: bf16
  n_runs: 1
  device: auto
  recurrent_training: false
  time_step: 1
  batch_size: 4
  regul_batch_scaling: sqrt
  batch_ratio: 1
  small_init_batch_size: false
  sparsity: none
  lr_W: 0.0009
  lr: 0.0018
  lr_embedding: 0.002325
  coeff_g_phi_diff: 375
  coeff_g_phi_norm: 0.45
  coeff_g_phi_weight_L1: 0.14
  coeff_g_phi_weight_L2: 0
  coeff_f_theta_msg_diff: 0
  coeff_f_theta_weight_L1: 0.025
  coeff_f_theta_weight_L2: 0.0005
  coeff_W_L1: 7.5e-05
  coeff_W_L2: 7.5e-07
  regul_annealing_rate: 0.0
  w_init_mode: randn_scaled
  use_gt_edges: true
  seed: 1046
  n_epochs: 1
  data_augmentation_loop: 500
  target_weighting: inv_increment_std
  target_weight_floor_pct: 5.0
config_file: fly/flyvis_current_noise_free_current_tw_cv04
