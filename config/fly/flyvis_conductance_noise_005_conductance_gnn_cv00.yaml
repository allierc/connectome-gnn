description: 'TRAINING spec. flyvis_conductance GNN fitted to flyvis_conductance_noise_005_blank50_cv00, the dataset generated BY a conductance model at noise_model_level 0.05. The GNN counterpart of flyvis_conductance_noise_005_conductance_knownode_cv00: same data, but nothing about the synapse is assumed -- W_ij is a free per-edge weight, the driving force and the activation live inside g_phi over [v_j, a_j, v_i, a_i], and the neuron update lives inside f_theta. Because the generator is itself a conductance model, this is the first time the GNN is asked to recover a driving force that actually exists in the data: (E_ij - v_i) is a real term here, not an artefact of fitting a current-based teacher. QUEUED, NOT READY TO SCORE. Reading E_ij, W_ij and the activation back out of g_phi needs a fit that separates the three -- g_phi mixes the conductance, the rectifier and the driving force into one learned surface, and the current slope-fit machinery recovers an effective weight only. Until that extraction exists the run trains and rolls out but produces no E_ij panel: connectome_gnn.metrics.compute_reversal_metrics returns None for any model without get_learned_reversal_per_edge, so no number is printed rather than a wrong one.'
