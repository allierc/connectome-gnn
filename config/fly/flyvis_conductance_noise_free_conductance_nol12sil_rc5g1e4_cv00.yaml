description: 'conductance GNN on the rig-2 (ion) twin, noise-free, fold 0, W L1 off and the silent-input anchor at 5 in place of coeff_g_phi_zero_below: the run where the anchor annihilated the message also had the L1 ratchet, so the two are separated here. ARM FAMILY nol12sil: coeff_W_L1 0 AND coeff_W_L2 0, with the silent-input anchor coeff_g_phi_silent 5. Nothing shrinks W at all here, which is the point: the two weight penalties and the message gauge are different levers on the same symptom, and with both penalties off whatever discipline the weights keep has to come from the anchor and from the gain term rather than from shrinkage. Read the control arm first -- with no penalty and no gauge pinning it is free to inflate or collapse, and that is the baseline the gain arms are measured against. Gain: coeff_f_theta_msg_gain 1.0e-04. The generator puts the message and the neuron''s own voltage in one bracket over one tau, so df/dmsg = -df/dv for every neuron whatever its tau, and nothing else in the loss says so -- the message scale is otherwise free, since msg/c with a gain of c through f_theta is the same trajectory. Measured on the trained sigma=0.05 conductance model: df/dv = -26.16 per second against df/dmsg = +1.098, i.e. G = 0.0403 where the ODE requires 1, a relative residual of 0.78 per neuron. Sized from that: the term is a norm(2) over the batch exactly like the trajectory loss, so 0.78 over ~13,700 neurons is a norm near 91 and 1e-4 contributes ~9e-3 against a trajectory loss of 0.04-0.13. Rollout curriculum K=1..5, dense per-step supervision, 5 epochs x 100 augmentation loops in place of 1 x 500. IT CANNOT BREAK THE GAUGE: msg/c with a gain of c reproduces the whole trajectory, not just one step, so multi-step supervision is as blind to the message scale as one-step is. What it can do is tighten tau, and tau is what limits the BLIND conductance readout -- Wij_R2 is 0.273 read with the model''s own tau against 0.691 with the generator''s. So it attacks the same gap from the other end. BUDGET: the horizon multiplies the cost per update, so this is about 3x the network evaluations of the one-step arms; the loop count is kept at 100 rather than cut to ~167 so the curriculum is the only thing that changed.'
