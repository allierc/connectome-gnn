dataset: flyvis_noise_005_020_blank50_cv00
description: 'rollout curriculum K=11..20 at measurement noise 0.20, forked from the K=1..10 run rather
  than continued in place: rc10 is a published row and resuming would overwrite it. Starts from that run''s
  epoch-9 checkpoint through training.pretrained_model, ten more epochs at K=11..20, the same compute
  per epoch since Niter is divided by the horizon. rc10 gave W_ij R2 0.880 at measurement noise 0.1 and
  0.747 at 0.2, the best of the ladder in both, and the question is whether depth keeps paying past ten.
  WATCH THE HORIZON AGAINST TAU: at K=20 and delta_t 0.02 the unrolled window is 0.4 s against a tau near
  0.02 s, twenty time constants, so the target may have forgotten its initial condition -- if rollout
  r rises while W_ij falls, that is what happened.'
