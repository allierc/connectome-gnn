description: 'Ten more epochs at K=11..20, forked from the rc10 run''s epoch-9 checkpoint rather than continued in place, so rc10 stays readable as its own row. WATCH THE HORIZON AGAINST TAU: at K=20 and delta_t 0.02 the unrolled window is 0.4 s against a tau near 0.02 s; on the measurement-noise data that was not too far, but this model''s message carries a driving force and may behave differently. On measurement-noise data the curriculum is the only lever in the campaign that never traded one metric for another: K=1,5,8,10,20 gave W_ij 0.746, 0.748, 0.759, 0.765, 0.775 with rollout r rising alongside, 0.964 to 0.994. That data is the current model on current data, where W_ij was already high. Here it is asked of the problem that is stuck: conductance on conductance, where the champion gnnsil_cv00 sits at W_ij 0.42 with rollout 0.86 and the known-ODE on the same data reaches 0.88, and where every other arm trades the two against each other.'
