description: 'Rollout at a REDUCED learning rate, 100x below peak, on flyvis_A noise-free, fold 3. Identical to flyvis_current_noise_free_current_rc_uniform_cv03 except the LR schedule. Motivation: every rc arm reaches the same W by the end of the K=1 epoch (0.869-0.885, matching the one-step baseline) and then LOSES ground once K>1 -- uniform -0.003, shoot1 -0.016, last -0.019, shoot2 -0.023, discount -0.024, sum -0.026, pushforward -0.231. All of them run the curriculum at full constant LR; the reference schedule this is taken from runs its rollout tail at 3e-4 of peak. decay_frac 0.438 = 320,000/730,666 puts the cosine floor exactly at the K=2 boundary, so the rollout phase runs at the floor. NOTE the K=1 phase now decays too rather than sitting at peak, so this changes two things -- but they separate post-hoc: metrics.log records the K=1 peak, and if it still lands at ~0.870 then any final-vs-peak improvement is the rollout LR alone.'
dataset: flyvis_noise_free_blank50_cv03
simulation:
  connectivity_file: to be specified
  adjacency_matrix: ''
  params:
  - - 1.0
    - 1.0
    - 1.0
    - 1.0
  n_neurons: 13741
  n_input_neurons: 1736
  n_neuron_types: 65
  n_edges: 434112
  n_frames: 64000
  delta_t: 0.02
  baseline_value: 0
  visual_input_type: DAVIS
  noise_model_level: 0.0
  seed: 45
  datavis_roots:
  - /groups/saalfeld/home/kumarv4/web_datasets/DAVIS2017-partial-test
  skip_short_videos: true
  blank_prefix_fraction: 0.5
graph_model:
  signal_model_name: flyvis_current
  prediction: first_derivative
  input_size: 3
  n_layers: 3
  hidden_dim: 80
  output_size: 1
  input_size_update: 5
  n_layers_update: 3
  hidden_dim_update: 80
  output_size_update: 1
  aggr_type: add
  embedding_dim: 2
  update_type: generic
  g_phi_positive: true
plotting:
  colormap: tab20
  arrow_length: 1
  xlim:
  - -2.5
  - 2.5
  ylim:
  - -100
  - 100
training:
  torch_compile: true
  mlp_precision: bf16
  n_runs: 1
  device: auto
  recurrent_training: true
  time_step: 1
  batch_size: 4
  regul_batch_scaling: sqrt
  batch_ratio: 1
  small_init_batch_size: false
  sparsity: none
  lr_W: 0.0009
  lr: 0.0018
  lr_embedding: 0.002325
  coeff_g_phi_diff: 375
  coeff_g_phi_norm: 0.45
  coeff_g_phi_weight_L1: 0.14
  coeff_g_phi_weight_L2: 0
  coeff_f_theta_msg_diff: 0
  coeff_f_theta_weight_L1: 0.025
  coeff_f_theta_weight_L2: 0.0005
  coeff_W_L1: 7.5e-05
  coeff_W_L2: 7.5e-07
  regul_annealing_rate: 0.0
  w_init_mode: randn_scaled
  use_gt_edges: true
  seed: 1045
  n_epochs: 5
  data_augmentation_loop: 100
  rollout_horizon_schedule: [1, 2, 3, 4, 5]
  rollout_step_weighting: uniform
  rollout_step_reduction: mean
  frame_target_offset: 1
  lr_scheduler: warmup_cosine_tail
  lr_scheduler_warmup_iters: 1000
  lr_scheduler_decay_frac: 0.438
  lr_scheduler_tail_ratio: 0.01
config_file: fly/flyvis_current_noise_free_current_rc_uniform_lrdiv100_cv03
