description: 'conductance GNN on the task-trained conductance dataset (flow/2000/001 ck28,
  exponential Euler), noise 005, fold 0. GAUGE GRID cell (silent 1, gain 0.0001) at coeff_g_phi_input_group_L1
  = 0.1. The message gauge is affine -- msg/c + d with a compensating f_theta is the same
  trajectory -- so fixing it takes one term per half: coeff_f_theta_msg_gain 0.0001 pins the
  SCALE by charging df/dmsg + df/dv, which the ODE makes exactly zero for every neuron whatever
  its tau, and coeff_g_phi_silent 1 pins the LEVEL at relu(v_j) = 0 where the true message
  is exactly zero. The nominal config has NEITHER, and every run of the killed batch came
  back with Wij gain 0.21-0.32 and Eij R2 0.55-0.73: E is immune to the scale (it is a ratio
  of two coefficients that carry it alike) and W is not, which is the signature of an unfixed
  scale rather than a failed recovery. SIZED ON THIS DATA: at iteration 213,332 of the lasso0
  fold-0 run, df/dv = -22.51 per unit voltage per second against df/dmsg = +9.29, i.e. G =
  0.413 where the ODE requires 1, a relative residual of 0.611 per neuron and an L2 norm of
  71.6 over 13,741 neurons. The term is a norm(2) over the batch like the trajectory loss,
  so 0.0001 contributes about 0.0072 before the sqrt batch scaling doubles it, against a trajectory
  loss of order 0.05. READ Wij_gain, not Wij_R2: the grid is trying to move the gain to 1,
  and R2 follows only if it does. PARAMETERISATION: w_squared true and g_phi_positive false,
  so the learned edge weight enters the message as W**2 -- non-negative, a conductance, the
  generator''s own convention -- and g_phi is free to be negative, which is what lets it carry
  the driving force (E_ij - v_i). The reverse pairing squares g_phi and leaves the sign in
  W, which is the CURRENT generator''s convention and cannot represent an inhibitory conductance
  synapse at all.'
