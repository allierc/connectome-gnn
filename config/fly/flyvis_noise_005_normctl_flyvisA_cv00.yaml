description: "Task 6 (flyvisA, cv00 seed 1041, coeff_g_phi_norm 0). Sensitivity control for the g_phi_norm anchor asymmetry. regularizer.py line 409 does in_features_edge_norm[:, 0] = 2*xnorm, hardcoding COLUMN 0 - which is v_i on the flyvis_conductance layout [vi,vj,ai,aj] but v_j on the flyvis_A layout [vj,aj]. So at coeff_g_phi_norm 0.9 the two families receive genuinely DIFFERENT priors, and the Task 2 vs Task 3 strict pairing does not hold for that term. Setting coeff_g_phi_norm 0 removes the asymmetric prior from both families, making the pair exactly comparable. Deliberately a config change and NOT a code fix: re-pointing the anchor at v_j for conductance would implicitly require g_phi to be flat in v_i, which is the discard hypothesis under test - the fix would manufacture the result."
