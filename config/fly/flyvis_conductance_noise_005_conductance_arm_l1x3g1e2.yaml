  coeff_W_L2: 7.5e-07
  regul_annealing_rate: 0.0
  w_init_mode: randn_scaled
  w_init_scale: 88
  use_gt_edges: true
  seed: 1042
  deterministic: true
  n_epochs: 8
  data_augmentation_loop: 64
  coeff_f_theta_msg_gain: 0.01
  checkpoint_saves_per_epoch: 3
