description: 'conductance GNN on the ion twin, noise 0.05, arm ''l1x3g1e2'': the two levers that each
  worked, together: lasso for the phantom edges, the gauge for the message scale. Base is flyvis_conductance_noise_005_conductance_gnn_cv00
  -- coeff_W_L1 7.5e-05, coeff_W_L2 7.5e-07, no anchor, no gauge term, K=1 -- which holds the campaign''s
  best fit (rollout r 0.970) and recovers nothing (W_ij R2 -1.17, E_ij -0.87). 1.64M iterations, the reference
  budget, cut into hour-long epochs with three checkpoints each so the run is readable while it runs.
  The question is W_ij and E_ij up with rollout r no lower than base at the same iteration.'
dataset: flyvis_conductance_ion_sub_noise_005_blank50_cv00
simulation:
  connectivity_file: to be specified
  adjacency_matrix: ''
  params:
  - - 1.0
    - 1.0
    - 1.0
    - 1.0
  n_neurons: 13741
  n_input_neurons: 1736
  n_neuron_types: 65
  n_edges: 434112
  n_frames: 64000
  delta_t: 0.02
  baseline_value: 0
  visual_input_type: DAVIS
  noise_model_level: 0.05
  seed: 42
  datavis_roots:
  - /groups/saalfeld/home/kumarv4/web_datasets/DAVIS2017-partial-test
  skip_short_videos: true
  blank_prefix_fraction: 0.5
graph_model:
  signal_model_name: flyvis_conductance
  prediction: first_derivative
  input_size: 6
  n_layers: 3
  hidden_dim: 80
  output_size: 1
  input_size_update: 5
  n_layers_update: 3
  hidden_dim_update: 80
  output_size_update: 1
  aggr_type: add
  embedding_dim: 2
  update_type: generic
  g_phi_positive: false
  w_squared: true
plotting:
  colormap: tab20
  arrow_length: 1
  xlim:
