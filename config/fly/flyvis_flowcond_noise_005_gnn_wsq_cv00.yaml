description: 'conductance GNN on the task-trained conductance dataset (flow/2000/001 ck28,
  exponential Euler), noise 005, fold 0. PLAIN BASELINE for the w_squared branch: no group
  lasso, no silent-input anchor, no message-gain term -- the three knobs the killed campaign
  swept are all off, so the only thing under test is whether the conductance parameterisation
  trains at all. w_squared true and g_phi_positive false: the weight enters the message as
  W**2, non-negative and therefore a conductance in the generator''s own convention, leaving
  g_phi free to carry the driving force (E_ij - v_i), which is negative on an inhibitory synapse.
  READ Wij_gain FIRST: the previous batch collapsed to 0.000 within 12k iterations because
  the init put W**2 six orders below a true conductance and W_L1/W_L2 charged the raw parameter,
  both since fixed. If the gain climbs off zero the parameterisation is viable and the gauge
  sweep can resume; if it stalls, lr_W (0.0009, tuned for the unsquared model) is the next
  thing to raise, since d(W**2)/dW = 2W is 0.064 at init and moves the conductance 16x more
  slowly.'
dataset: flyvis_flowcond_noise_005_blank50_cv00
