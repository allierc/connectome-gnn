description: 'Conductance twin, margin reversals, dim=per_neuron, span unit extremes. E brackets from the teacher min/max in every rig -- the sign guarantee and the convex-hull bound do not depend on this axis -- and only the UNIT of delta changes. cond_span_mode extremes is PR #46 exactly: span = v_max - v_min, which on this teacher is set by outliers (98%% of the voltage lies in a band of width 3.86 against a global range of 16.27), so the nominal margin (0.4, 1.0) acts ~3.4x larger than intended and (E_exc - V_i) varies by only 16%% across the bulk -- the delta -> infinity limit, i.e. the twin degenerating to the current-based teacher. The percentile spans restore state dependence: at dim=global, 32.8%% (p99), 38.0%% (p95), 41.5%% (p90). At dim=per_neuron every reversal sits just outside its own neuron band and the driving force varies by more than 100%%, the opposite extreme. This grid measures whether more state dependence helps the held-out rollout or costs stability.'
