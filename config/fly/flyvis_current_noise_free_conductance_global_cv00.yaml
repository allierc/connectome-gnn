description: 'Conductance student distilled from the current-based flyvis teacher, noise-free, fold 0. RIG 1, global: one cation reversal and one chloride reversal for the whole network, so E_ij depends on the edge type only and the receiving cell never enters. The baseline the ion rig is read against. Reversals are stated in MULTIPLES OF THE NETWORK''S VOLTAGE EXCURSION RELATIVE TO REST, because flyvis carries no voltage scale: the state variable is called activity, the resting potential is initialised Normal(0.5, 0.05), and the dynamics are invariant under v -> lambda v with bias and stimulus scaled alike, so the millivolt scale is not merely unmeasured but unidentifiable. On this teacher the central-99% voltage width is 4.876 (mean 0.416, std 0.700, extremes [-5.878, 8.340]) and V_rest takes 65 values in 0.007..0.796, mean 0.511; reading that width as the ~20 mV graded excursion of a medulla neuron gives ~4.1 mV per model unit. E_exc is then pinned at +2.5 excursions above rest = +15.1 model units -- the ~50 mV excitatory driving force of a real neuron -- which lands 1.8x above v_max, bracketed BY BIOLOGY rather than by fiat. E_inh is LEARNED in [-1.5, +0.5] excursions of rest = [-6.81, +2.95] model units, the physiological range of the chloride equilibrium potential (-90 to -50 mV against a rest of -60); the typical -70 mV value lands at -1.93, inside the central-99% band, so the inhibitory driving force reverses whenever the cell crosses it. That is ordinary shunting and depolarising inhibition, not a failure, and it is why no bracket is imposed. Everything else held -- W learned per edge and entering squared, tau/V_rest learned per cell type, stage-1 closed-form init alpha = alpha_curr/(E - Vbar_ti) taken on |alpha| where the physiological reversal sits on the far side of the cell''s mean voltage, per-edge polarity from the connectome sign (exact: all 604 (pre-type -> post-type) groups carry a constant sign, 0 mixed). NOT parameter recovery: the teacher has no (E - v_i) term, so the acceptance test is the ROLLOUT.'
