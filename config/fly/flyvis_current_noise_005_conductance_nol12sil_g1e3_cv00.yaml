description: 'conductance GNN on the CURRENT generator''s data, noise 0.05, blank50, fold 0. The model
  is larger than the circuit that produced the data: the conductance family''s per-edge message is W_ij
  * act(v_j) * (E_ij - v_i), while the generator''s is W_ij * act(v_j) with no driving force, so E_ij
  has nothing to recover and the extra factor is free to absorb scale. ARM FAMILY nol12sil with gain 1e-3:
  coeff_W_L1 0 and coeff_W_L2 0, the silent-input anchor coeff_g_phi_silent 5, and coeff_f_theta_msg_gain
  1.0e-03. THE QUESTION: with no lasso on W at all, does the over-specified model still recover the current
  circuit, or does the unused driving force let W inflate or collapse? The current-family reference at
  the same noise and fold reaches W_ij R2 about 0.96 with coeff_W_L1 7.5e-05 on; anything the conductance
  model loses against that number is the cost of the larger hypothesis class, and anything it keeps says
  the sparsity penalty was not what held W in place. Five folds, because one fold cannot separate a recovery
  failure from a fold.'
