description: 'one-hour probe, BOTH goals: the wave-one W_ij winner under a 1,2,4 recurrent curriculum. The curriculum is the only rollout lever that has not cost W_ij elsewhere, and this is the arm that says whether the two compose. Wave two, off the wave-one result: at 46,000 iterations the silent anchor with the gauge at 1e-3 leads on W_ij (+0.24) against no-priors (-2.05), no-L2-with-gauge (+0.10) and L1x3-with-anchor (-0.09), with base at about -0.2. This wave brackets that point. Reference: arm_base at the same iteration, rollout r ~0.5, W_ij ~-0.2; the known-ODE on this data reaches W_ij 0.88.'
