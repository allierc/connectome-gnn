description: 'Conductance student distilled from the current-based flyvis teacher, noise-free, fold 0. E reversal rig ion: the two rows are two ION SPECIES rather than two polarities, because the sender''s transmitter selects a channel and the channel selects an ion -- acetylcholine opens a nicotinic sodium/potassium channel, GABA opens Rdl and glutamate opens GluCl, both chloride, so three transmitters give two rows. The cation reversal is set by sodium and potassium gradients every cell holds near the same values, so E_exc is ONE number for the whole network; the chloride reversal is set by the KCC2/NKCC1 transporter balance, which differs cell type to cell type, so E_inh is one per cell type. 66 reversal parameters against per_type''s 130, spent where the variation is. Both rows still SET from the teacher''s voltage range, E_exc = V_max + 1.0*span, E_inh = V_min - 0.4*span, each reduced onto its own rows, so bracketing stays structural. This is also the rig that makes E rank 2 over (i,j) pairs: with both rows global E_ij is one outer product and carries no i-dependence at all. Everything else held -- W learned per edge and entering squared, tau/V_rest learned per cell type, stage-1 closed-form init alpha = alpha_curr/(E - Vbar_ti), per-edge polarity from the connectome sign (Dale fails here, 4,573 of 13,279 presynaptic neurons have mixed-sign outgoing edges). NOT parameter recovery: the teacher has no (E - v_i) term, so the acceptance test is the ROLLOUT.'
