description: 'Conductance GNN on the rig-2 (ion) twin''s data, noise 0.0, fold 0. STRUCTURE: W enters squared (w_squared true), so the learned edge weight is a non-negative conductance, and g_phi is NOT squared (g_phi_positive false), so the sign of every synapse must be produced by g_phi(v_j, a_j, v_i, a_i) -- learned from the two embeddings, with no polarity input. This is the parameterisation the generator implies: g_phi has to become relu(v_j) * (E_ij - v_i), which is positive on excitatory edges, negative on 99%% of inhibitory samples, and reverses on 18%% of (neuron, frame) samples where v_i crosses E_Cl. Everything else -- MLP sizes, learning rates, batch, and EVERY regulariser -- is copied from the current-GNN paper config flyvis_current_noise_free_current_cv00, as the baseline the regulariser discussion starts from; w_init_scale 88 is the one addition, so W**2 starts at the true non-zero conductance mean (0.0179) rather than at 2.3e-6. The eight earlier conductance GNN arms are in archive_5, with their logs. REGULARISERS, decided against the current-GNN paper values after the archive_5 round: coeff_g_phi_diff 375 -> 0 (its hinge fines g_phi for decreasing in v_j, which an inhibitory g_phi must do -- 99%% of inhibitory samples); coeff_g_phi_norm 0.45 -> 0 (pins every pair to +2*xnorm, which an inhibitory pair cannot reach); coeff_g_phi_weight_L1 0.14 -> 0 (with the norm anchor gone it collapses g_phi to zero, message scale 1e-13 by iteration 16K); coeff_g_phi_zero_below 0 -> 5, the sign-free anchor that replaces them -- g_phi = 0 wherever v_j < 0, exact for every edge, the only free-run-stable arm of the last round and the one that brought tau outliers to the known-ODE''s level. Every other coefficient is the paper''s. Known and left as-is: coeff_W_L1/L2 act on the raw W = sqrt(g), so L1 on W is L1 on sqrt(g) and L2 on W is L1 on the conductance; coeff_W_sign and lock_edge_signs_from_connectome are inert under w_squared. Open lever not used here: coeff_embedding_cluster, the one term that addresses the sign having to come from (a_i, a_j).'
dataset: flyvis_conductance_ion_noise_free_blank50_cv00
simulation:
  connectivity_file: to be specified
  adjacency_matrix: ''
  params:
  - - 1.0
    - 1.0
    - 1.0
    - 1.0
  n_neurons: 13741
  n_input_neurons: 1736
  n_neuron_types: 65
  n_edges: 434112
  n_frames: 64000
  delta_t: 0.02
  baseline_value: 0
  visual_input_type: DAVIS
  noise_model_level: 0.0
  seed: 42
  datavis_roots:
  - /groups/saalfeld/home/kumarv4/web_datasets/DAVIS2017-partial-test
  skip_short_videos: true
  blank_prefix_fraction: 0.5
graph_model:
  signal_model_name: flyvis_conductance
  prediction: first_derivative
  input_size: 6
  n_layers: 3
  hidden_dim: 80
  output_size: 1
  input_size_update: 5
  n_layers_update: 3
  hidden_dim_update: 80
  output_size_update: 1
  aggr_type: add
  embedding_dim: 2
  update_type: generic
  g_phi_positive: false
  w_squared: true
plotting:
  colormap: tab20
  arrow_length: 1
  xlim:
  - -2.5
  - 2.5
  ylim:
  - -100
  - 100
training:
  torch_compile: true
  mlp_precision: fp32
  n_runs: 1
  device: auto
  recurrent_training: false
  time_step: 1
  batch_size: 4
  regul_batch_scaling: sqrt
  batch_ratio: 1
  small_init_batch_size: false
  sparsity: none
  lr_W: 0.0009
  lr: 0.0018
  lr_embedding: 0.002325
  coeff_g_phi_diff: 0
  coeff_g_phi_norm: 0
  coeff_g_phi_weight_L1: 0
  coeff_g_phi_weight_L2: 0
  coeff_g_phi_zero_below: 5
  coeff_f_theta_msg_diff: 0
  coeff_f_theta_weight_L1: 0.025
  coeff_f_theta_weight_L2: 0.0005
  coeff_W_L1: 7.5e-05
  coeff_W_L2: 7.5e-07
  regul_annealing_rate: 0.0
  w_init_mode: randn_scaled
  w_init_scale: 88
  use_gt_edges: true
  seed: 1042
  deterministic: true
  n_epochs: 1
  data_augmentation_loop: 500
config_file: fly/flyvis_conductance_noise_free_conductance_gnn_cv00
