description: 'one-hour probe, goal rollout: the same 1,2,4,8 curriculum at batch size 8. A longer horizon makes each gradient noisier, so this asks whether averaging over twice the batch is what the curriculum needs. Reference: arm_base at the same 100k iterations reaches rollout r ~0.60 and W_ij R2 ~-0.23; the known-ODE on this data reaches W_ij 0.88, so the information is in the data and the GNN''s constants are what is unidentified.'
