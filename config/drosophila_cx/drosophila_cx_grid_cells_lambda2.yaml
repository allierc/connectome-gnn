description: "Drosophila CX: heading + distance + GRID CELLS on a torus (Net1 CX + learnable sign-locked E/I Net2)."
dataset: drosophila_cx_si_task_338_grid_cells
simulation:
  gcamp_kernel: gcamp6f
  params:
    - - 1.0
  connconstr_datapath: papers/Code_NN/Code_NN/Data/Figure5/exported-traced-adjacencies-v1.2
  seed: 100000
graph_model:
  # Net1 = sign-locked CX path-integration RNN (heading+distance); Net2 =
  # learnable sign-locked E/I place network reading Net1's state. The wrapper
  # model builds both. (For pure data generation only the task block matters.)
  signal_model_name: drosophila_cx_pi_place
  aggr_type: add
  input_proj: matrix
  output_proj: matrix
  velocity_gate: pen_pfn
  lock_edge_signs: true
  hidden_dim: 128
  n_layers: 3
  MLP_activation: relu
  output_from_epg_only: true
circuit:
  name: drosophila_cx_338_v1
plotting:
  colormap: tab10
  anatomy_voltage_elev: 7.6
  anatomy_voltage_azim: 86.6
  anatomy_voltage_z_lo: 0.0
  anatomy_voltage_z_hi: 10.0
  anatomy_voltage_alpha: 1.0
  anatomy_voltage_downsample: 10
  anatomy_voltage_bg: black
  anatomy_voltage_show_base: true
  anatomy_voltage_show_icon: false
  anatomy_voltage_types: []
  anatomy_voltage_pattern: const
  anatomy_voltage_n_steps: 5000
  anatomy_voltage_stride: 5
  anatomy_voltage_frame_idx: -1
  anatomy_voltage_omega_deg: 60.0
  anatomy_voltage_theta0_rad: 0.0
  anatomy_voltage_swim_interval_s: 1.0
  anatomy_voltage_swim_magnitude_rad: 0.393
  anatomy_voltage_swim_t_event_s: 0.0
  anatomy_voltage_seed: 0
training:
  device: auto
  seed: 200000
  n_runs: 1
  n_epochs: 10
  batch_size: 64
  data_augmentation_loop: 3
  lr: 0.002
  lr_W_rec_schedule: [0.0005, 0.0005, 0.00025, 0.000125, 0.000125, 0.0001, 0.0001, 0.0001, 5.0e-05, 5.0e-05]
  lr_scheduler: none
  lr_W_ED: 0.0025
  grad_clip_W: 2.5
  coeff_cos_distance: 0.0
  coeff_norm_floor: 0.0
  kappa_norm_floor: 0.0
  coeff_tv_circular: 0.0
  coeff_W_L1: 0.0
  noise_recurrent_level: 0.03
  snapshots_per_epoch: 5
  n_steps_schedule: [100, 200, 200, 200, 300, 400, 500, 600, 700, 800]
  coeff_tail_loss: 0.035
  torch_compile: false
  w_init_mode: w_con
  # Net1 (CX) supervises heading+distance; Net2 the place code.
  task_targets: ['grid_cells']
  coeff_place: 1.0
  coeff_pos: 1.0
  place_anchor: true   # PI anchor: seed place/grid cells at the start position (t=0)
task:
  task_type: swim_integration
  task_only: true
  swim_integration:
    n_trials_train: 100000
    n_trials_test: 10000
    n_steps: 1000
    dt: 0.01
    swim_rate_hz: 0.5
    swim_duration_s: 0.3
    phase_impulse_mean_rad: 0.785
    phase_impulse_std_rad: 0.4
    backward_phase_mean_rad: 3.14
    backward_phase_std_rad: 0.3
    left_fraction: 0.3
    right_fraction: 0.3
    forward_fraction: 0.2
    backward_fraction: 0.2
    omega_noise_level: 0.0
    forward_vel_mean: 1.0
    forward_vel_std: 0.4
    target_kind: grid_cells
    # Arena / place-field geometry
    arena_half: 1.0
    place_grid: 20
    place_sigma: 0.2
    # --- grid-cell torus geometry ---
    grid_period: 2.0
    grid_grid: 20
    grid_sigma: 0.4
    # Net2 synthetic sign-locked E/I connectome
    net2_n_interneurons: 200
    net2_sparsity: 0.4
    net2_ei_ratio: 0.5
    net2_seed: 700000
    seed: 300000
