github: https://github.com/allierc/connectome-gnn
branch: main

code:
  gnn_model: {file: src/connectome_gnn/models/neural_gnn.py, find: '^class NeuralGNN\b', name: 'GNN model (NeuralGNN)'}
  gnn_message: {file: src/connectome_gnn/models/neural_gnn.py, find: 'if self.model == "flyvis_conductance"', name: 'message MLP(a_i,a_j,v_i,v_j)'}
  known_ode_model: {file: src/connectome_gnn/models/known_ode.py, find: '^class FlyvisKnownODE\b', name: 'Known-ODE model (FlyvisKnownODE)'}
  trainer: {file: src/connectome_gnn/models/graph_trainer.py, find: '^def data_train_gnn\(', name: 'trainer (data_train_gnn)'}
  recurrent_loss: {file: src/connectome_gnn/models/recurrent_step.py, find: '^def _dense_rollout_loss\(', name: 'recurrent rollout loss'}
  regularizer: {file: src/connectome_gnn/models/regularizer.py, find: '^class LossRegularizer\b', name: 'regularizer (LossRegularizer)'}
  reg_W: {file: src/connectome_gnn/models/regularizer.py, find: '# --- W regularization', name: 'W L1/L2 penalty'}
  reg_group_lasso: {file: src/connectome_gnn/models/regularizer.py, find: '# --- g_phi input-group lasso', name: 'g_phi input group lasso'}
  tester: {file: src/connectome_gnn/models/graph_tester.py, find: '^def data_test_gnn\(', name: 'tester: one-step and rollout r (data_test_gnn)'}
  plot_pass: {file: GNN_PlotFigure.py, find: '^def plot_synaptic\(', name: 'plot pass (plot_synaptic)'}
  extract: {file: src/connectome_gnn/metrics.py, find: '^def extract_template_params\(', name: 'template readout (extract_template_params)'}
  score: {file: src/connectome_gnn/metrics.py, find: '^def score_recovery\(', name: 'R2 / slope / outliers (score_recovery)'}
  cluster: {file: src/connectome_gnn/metrics.py, find: '^def cluster_recovery\(', name: 'clustering accuracy (cluster_recovery)'}
  pairs: {file: src/connectome_gnn/recovery_figures.py, find: '^def write_recovered_pairs\(', name: 'per-edge message pairs (write_recovered_pairs)'}

gnn_code: [gnn_model, gnn_message, trainer, regularizer, reg_W, reg_group_lasso, tester, plot_pass, extract, score, cluster]
kode_code: [known_ode_model, trainer, regularizer, reg_W, tester, plot_pass, extract, score, cluster]

items:
  tab:cv_gnn_vs_baselines:
    script: experiments/paper/scripts/table_1_gnn_vs_baselines.py
    code: [gnn_model, gnn_message, known_ode_model, trainer, regularizer, reg_W, reg_group_lasso, tester, plot_pass, extract, score, cluster]
    sections:
      - {name: Known ODE, anchor: Known ODE, experiment: 15, arm: kode, cells: {condition: [flyvis_noise_free, flyvis_noise_005, flyvis_noise_05]}}
      - {name: GNN (ours), anchor: GNN (ours), experiment: 2, arm: cond_l25, cells: {noise: [noise_free, noise_005, noise_05]}}
      - {name: Recurrent MLP (published), anchor: Recurrent MLP}
      - {name: EED model (published), anchor: EED Model}
  fig:gnn_params_3col_noise_comparison:
    script: experiments/paper/scripts/fig_gnn_params_3col.py
    figure: figures/fig_gnn_params_3col_noise_comparison
    code: [gnn_model, gnn_message, trainer, regularizer, reg_group_lasso, plot_pass, extract, score, pairs]
    sections:
      - {name: three model-noise levels, experiment: 2, arm: cond_l25, cells: {noise: [noise_free, noise_005, noise_05]}}
  fig:flywire:
    script: experiments/paper/scripts/fig_flywire_hybrid.py
    figure: figures/fig_flywire_hybrid_new
    code: [gnn_model, gnn_message, trainer, regularizer, reg_group_lasso, tester]
    sections:
      - {name: FlyWire eye, experiment: 7, arm: condl25, cells: {variant: [full_eye_flywireRF_noise_005, full_eye_flywireRF_proximal_nulls_noise_005]}}
  tab:zero_edge_inliers:
    script: experiments/paper/scripts/table_2_flybrid.py
    code: [gnn_model, gnn_message, known_ode_model, trainer, regularizer, reg_group_lasso, tester, plot_pass, extract, score]
    sections:
      - {name: Known ODE, anchor: Known ODE, experiment: 7, arm: kode}
      - {name: GNN, anchor: GNN, experiment: 7, arm: condl25}
      - {name: MLP and EED (published), anchor: MLP}
  tab:cv_cross_noise:
    script: experiments/paper/scripts/table_s4_cross_noise.py
    code: [gnn_model, gnn_message, trainer, recurrent_loss, regularizer, reg_group_lasso, tester, plot_pass, extract, score, cluster]
    sections:
      - {name: low model noise, anchor: low model noise, experiment: 2, arm: cond_l25, cells: {noise: [noise_005]}}
      - {name: measurement noise, anchor: low meas, experiment: 3, arm: cond_l25}
      - {name: unknown stimulus, anchor: unknown stimulus, experiment: 11, arm: condl251s}
      - {name: +400% null edges, anchor: 400% null edges, experiment: 4, arm: [cond_l25, cond_l100]}
      - {name: edges removed, anchor: 20% edges removed, experiment: 14, arm: condl251s, cells: {condition: [rm20, rm50]}}
      - {name: 1/5 frames, anchor: 'rollout horizon 6', experiment: 5, arm: cond_l25}
      - {name: 10% hidden, anchor: 10% hidden, experiment: 14, arm: condl251s, cells: {condition: [hid10]}}
      - {name: 20% hidden, anchor: 20% hidden, experiment: 9, arm: condl251s, cells: {hidden: [none]}}
  fig:rollout_3col_noise_comparison:
    script: experiments/paper/scripts/fig_rollout_3col.py
    figure: figures/fig_rollout_3col_noise_comparison
    code: [gnn_model, gnn_message, trainer, tester]
    sections:
      - {name: three model-noise levels, experiment: 2, arm: cond_l25, cells: {noise: [noise_free, noise_005, noise_05]}}
  fig:clustering_appendix:
    script: experiments/paper/scripts/fig_clustering_appendix.py
    figure: figures/fig_clustering_appendix
    code: [gnn_model, plot_pass, cluster]
    sections:
      - {name: low model noise, experiment: 2, arm: cond_l25, cells: {noise: [noise_005]}}
  fig:rollout_3col_noise_comparison_ablation50:
    script: experiments/paper/scripts/fig_rollout_ablation50.py
    figure: figures/fig_rollout_3col_noise_comparison_ablation50
    code: [gnn_model, gnn_message, tester]
    sections:
      - {name: three model-noise levels, experiment: 2, arm: cond_l25, cells: {noise: [noise_free, noise_005, noise_05]}}
  fig:stim_rollout_inr:
    script: experiments/paper/scripts/fig_stim_rollout_inr.py
    figure: figures/fig_stim_rollout_inr
    code: [gnn_model, gnn_message, trainer, regularizer, reg_group_lasso, tester]
    sections:
      - {name: unknown stimulus, experiment: 11, arm: condl251s}
  fig:gnn_params_4col_flywire_comparison:
    script: experiments/paper/scripts/fig_gnn_params_4col_flywire.py
    figure: figures/fig_gnn_params_4col_flywire_comparison
    code: [gnn_model, gnn_message, trainer, regularizer, reg_group_lasso, plot_pass, extract, score]
    sections:
      - {name: four FlyWire variants, experiment: 7, arm: condl25}
  fig:know_ode_rollout:
    script: experiments/paper/scripts/fig_rollout_known_ode.py
    figure: figures/fig_rollout_3col_noise_comparison_known_ode
    code: [known_ode_model, tester]
    sections:
      - {name: three model-noise levels, experiment: 15, arm: kode, cells: {condition: [flyvis_noise_free, flyvis_noise_005, flyvis_noise_05]}}
  fig:known_ode_params_3col_noise_comparison:
    script: experiments/paper/scripts/fig_known_ode_params_3col.py
    figure: figures/fig_known_ode_params_3col_noise_comparison_new
    code: [known_ode_model, plot_pass, extract, score, cluster]
    sections:
      - {name: three model-noise levels, experiment: 15, arm: kode, cells: {condition: [flyvis_noise_free, flyvis_noise_005, flyvis_noise_05]}}
  tab:cv_known_ode:
    script: experiments/paper/scripts/table_s7_known_ode.py
    code: [known_ode_model, trainer, tester, plot_pass, extract, score, cluster]
    sections:
      - {name: model noise, anchor: noise-free, experiment: 15, arm: kode, cells: {condition: [flyvis_noise_free, flyvis_noise_005, flyvis_noise_05]}}
      - {name: measurement noise, anchor: low meas, experiment: 15, arm: kode, cells: {condition: [flyvis_noise_005_010, flyvis_noise_005_020]}}
      - {name: edges, anchor: 400% null edges, experiment: 15, arm: kode, cells: {condition: [flyvis_noise_005_null_edges_pc_400, flyvis_noise_005_removed_pc_20, flyvis_noise_005_removed_pc_50]}}
