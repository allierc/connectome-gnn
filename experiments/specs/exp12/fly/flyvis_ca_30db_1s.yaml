description: 'Experiment 12: current GNN on voltage deconvolved from calcium, 30 dB SNR, lambda blind, one-step training.'
dataset: fly/flyvis_unified_blank50_ca_30db
simulation:
  connectivity_file: to be specified
  datavis_roots:
    - "/groups/saalfeld/home/kumarv4/web_datasets/DAVIS2017-partial-test/"
  adjacency_matrix: ''
  params:
  - - 1.0
    - 1.0
    - 1.0
    - 1.0
  n_neurons: 13741
  n_input_neurons: 1736
  n_neuron_types: 65
  n_edges: 434112
  n_frames: 64000
  delta_t: 0.02
  baseline_value: 0
  visual_input_type: DAVIS
  noise_model_level: 0.05
  blank_prefix_fraction: 0.50
  seed: 42

  calcium_type: none
  calcium_kernel_variant: gcamp6f
  calcium_kernel_tau_rise: 0.075
  calcium_kernel_tau_decay: 0.4
  calcium_kernel_length_seconds: 2.4
  calcium_kernel_dt_seconds: 0.02
  calcium_alpha: 1.0
  calcium_beta: 0.0
  save_calcium: false

graph_model:
  signal_model_name: flyvis_A
  prediction: first_derivative
  input_size: 3
  n_layers: 3
  hidden_dim: 80
  output_size: 1
  input_size_update: 5
  n_layers_update: 3
  hidden_dim_update: 80
  output_size_update: 1
  aggr_type: add
  embedding_dim: 2
  update_type: generic
  g_phi_positive: true

plotting:
  colormap: tab20
  arrow_length: 1
  xlim:
  - -2.5
  - 2.5
  ylim:
  - -100
  - 100

training:
  n_epochs: 1
  n_runs: 1
  device: auto
  recurrent_training: false
  time_step: 1
  batch_size: 4
  batch_ratio: 1
  small_init_batch_size: false
  sparsity: none
  data_augmentation_loop: 500
  lr_W: 0.0009
  lr: 0.0018
  lr_embedding: 0.002325
  coeff_g_phi_diff: 750
  coeff_f_theta_msg_diff: 0
  coeff_g_phi_norm: 0.9
  coeff_g_phi_weight_L1: 0.28
  coeff_f_theta_weight_L1: 0.05
  coeff_g_phi_weight_L2: 0
  coeff_f_theta_weight_L2: 0.001
  coeff_W_L1: 0.00015
  coeff_W_L2: 1.5e-06

  regul_annealing_rate: 0.0
  w_init_mode: randn_scaled
  use_gt_edges: true

  seed: 42

  observable: voltage
config_file: fly/flyvis_ca_30db_1s
