description: 'Experiment 3 burn-in arm: the currc20 spec with rollout_burn_in 8 and
  rollout_horizon_schedule [9..20] held at 20 (was [1..20]); nothing else changed.
  Steps 0-7 are integrated and back-propagated through but not scored, because under
  measurement noise that is where the dense loss prefers a shrunken connectome over
  the true one. The schedule has to start past the burn-in or those epochs would score
  nothing, so this arm also drops exp03''s horizons 1-8.'
