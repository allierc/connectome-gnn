id: derivative_target
title: The derivative target, across a model-noise sweep
question: does the derivative target alone explain the before/after table, and does
  its effect grow with the model noise the generator's y_list leaves out?
task: train
queue: gpu_l4
wall: '24:00'
axes:
  noise:
  - noise_free
  - noise_005
  - noise_05
  fold:
  - cv00
  - cv01
  - cv02
  - cv03
  - cv04
arms:
- id: nominal
  label: finite difference of the observed voltage
  spec: flyvis_{noise}_blank50_dtfd_{fold}
  overrides: {}
- id: bug
  label: the generator's stored y_list
  spec: flyvis_{noise}_blank50_dtbug_{fold}
  overrides:
    training.derivative_target: y_list
report:
  caption: 'Thirty runs: three model-noise levels, two derivative targets, five folds.
    The arms differ only in training.derivative\_target. The bug arm trains against
    f(v), which the process noise is added after, so the two targets differ by xi/dt
    -- zero at noise\_free and growing with the level.'
