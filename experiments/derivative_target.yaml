id: derivative_target
title: Recovery errors, before and after the derivative-target fix
purpose: regenerate slide 5 and 6 of presentation/conductance.pdf with sound training
  (one parameter changes only) -- it was not -- and look at these plots again
baseline: experiments/baseline/gnn_current_baseline.yaml
specs: experiments/specs/fly
task: train
queue: gpu_l4
wall: '48:00'
axes:
  noise:
  - noise_free
  - noise_005
  - noise_05
  fold:
  - cv00
  - cv01
  - cv02
  - cv03
  - cv04
arms:
- id: nominal
  label: finite difference of the observed voltage
  spec: flyvis_{noise}_blank50_dtfd_{fold}
  overrides: {}
- id: bug
  label: the generator's stored y_list
  spec: flyvis_{noise}_blank50_dtbug_{fold}
  overrides:
    training.derivative_target: y_list
report:
  caption: 'Thirty runs: three model-noise levels, two derivative targets, five folds.
    The arms differ only in training.derivative\_target.'
