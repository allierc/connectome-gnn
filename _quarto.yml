project:
  type: website
  output-dir: _site
  render:
    - "index.qmd"
    - "drosophila-cx.qmd"
    - "drosophila-degeneracy.qmd"
    - "zebrafish.qmd"

website:
  title: "Heading-Direction Circuits"
  description: "Identifiable computation, non-identifiable implementation in the fly central complex and the zebrafish anterior hindbrain."
  navbar:
    background: dark
    left:
      - text: "Home"
        href: index.qmd
      - text: "Drosophila CX — Circuit & Models"
        href: drosophila-cx.qmd
      - text: "Drosophila CX — Identifiability"
        href: drosophila-degeneracy.qmd
      - text: "Zebrafish dIPN"
        href: zebrafish.qmd
    tools:
      - icon: github
        href: https://github.com/allierc/connectome-gnn
  page-footer: "Copyright 2026, Saalfeld Lab — companion website to the central-complex and zebrafish manuscripts. Text condensed from the source LaTeX by Claude and reviewed by C. Allier."
  repo-url: https://github.com/allierc/connectome-gnn/
  site-url: https://allierc.github.io/connectome-gnn/

execute:
  enabled: false

format:
  html:
    theme:
      light: flatly
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: false
    fig-cap-location: bottom
    code-tools: false
