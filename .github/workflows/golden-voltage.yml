name: golden-voltage

# Byte identity of data_generate_voltage against tests/golden_voltage/BASE_SHA
# (the refactor of generators/graph_data_generator.py into generators/voltage/).
#
# NOT YET RUN IN CI. Phase 1 of the refactor was verified locally only (macOS,
# flyvis-gnn-mac env; see tests/golden_voltage/DETERMINISM.md). Run it once by
# hand (Actions -> golden-voltage -> Run workflow); when it is green, enable the
# pull_request and schedule triggers below. The reference (base) run always
# happens on the same runner as the head run, so BLAS / platform differences
# between Accelerate and OpenBLAS never enter the comparison.
on:
  workflow_dispatch:
    inputs:
      tier:
        description: "fast | full"
        default: fast
  # pull_request:
  #   paths:
  #     - "src/connectome_gnn/generators/**"
  #     - "src/connectome_gnn/zarr_io.py"
  #     - "src/connectome_gnn/neuron_state.py"
  #     - "src/connectome_gnn/plot.py"
  #     - "src/connectome_gnn/models/teacher_eval.py"
  #     - "GNN_PlotFigure.py"
  #     - "tests/golden_voltage/**"
  #     - "scripts/golden_voltage.py"
  # schedule:
  #   - cron: "0 3 * * *"

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the base worktree is checked out from BASE_SHA
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: echo "CGNN_GOLDEN_WORK=$RUNNER_TEMP/golden" >> "$GITHUB_ENV"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # flyvis pinned to the commit the local golden runs used
      - run: pip install "git+https://github.com/lappalainenj/flyvis@7c29aed"
      - run: pip install -e '.[test]'
      - run: python scripts/golden_voltage.py fixtures --tier "${{ inputs.tier || 'fast' }}"
      - run: python scripts/golden_voltage.py run --tier "${{ inputs.tier || 'fast' }}" --impl both --jobs 2 --label ci
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-voltage-runs
          path: ${{ env.CGNN_GOLDEN_WORK }}/runs/ci
          retention-days: 7
